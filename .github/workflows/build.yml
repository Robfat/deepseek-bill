name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version && xcrun --show-sdk-path

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekBill.app
          path: DeepSeekBill.app
          if-no-files-found: error
